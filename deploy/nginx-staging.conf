# Prüf-Zugang tonn-versicherung: NUR auf 127.0.0.1:8080 erreichbar (Zugriff per SSH-Tunnel), kein öffentlicher Port, kein DNS.
# Auf dem Server: /etc/nginx/conf.d/tonn-staging.conf
server {
    listen 127.0.0.1:8080;
    server_name _;
    access_log /var/log/nginx/tonn-staging.access.log anon_main;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
