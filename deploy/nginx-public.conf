# Öffentlicher Zugang tonn-versicherung.de. Hauptadresse: https://tonn-versicherung.de ; www und HTTP leiten dorthin (Pfad + Parameter bleiben).
# Auf dem Server: /etc/nginx/conf.d/tonn-public.conf (root:root 644). Einspielen/Zurückrollen: siehe deploy/NGINX.md.
# Staging-Zugang 127.0.0.1:8080 bleibt unverändert in tonn-staging.conf (Deploy-Healthcheck). noindex bleibt aktiv.
#
# Hinweise zu den Locations im HTTPS-Block:
#  - add_header X-Robots-Tag steht auf server-Ebene. In den Locations darf KEIN add_header stehen, sonst wird es nicht mehr vererbt (noindex ginge verloren).
#  - proxy_set_header wird ebenfalls nicht vererbt, sobald eine Location eigene setzt; daher in jeder Location vollständig.
#  - /_next/static/: unveränderliche Build-Dateien, kein limit_req (ein Seitenaufruf löst allein 40-90 Anfragen aus; mehrere Besucher hinter einer IP
#    (Büro, Mobilfunk-CGNAT) liefen sonst in 429).
#  - /_next/image: proxy_ignore_client_abort on – Next.js 16.3.8 blockiert nach Abbruch der Verbindung während der AVIF-Kodierung den Bild-Schlüssel
#    dauerhaft (bis Container-Neustart). Das ist eine SCHUTZMASSNAHME, keine Behebung des Next.js-Fehlers. proxy_read_timeout 120s, damit Nginx
#    selbst die Upstream-Verbindung (und damit Next) nicht vor Ende einer langsamen Kodierung abbricht.
#  - burst=250 (gemessen: 10 gleichzeitige Besucher hinter einer IP ohne 429); Dauerrate bleibt 20 r/s pro IP (Zone general in 00-tonn-global.conf).
#  - Die Zone "contact" (6 r/min) ist in 00-tonn-global.conf definiert, wird aber in keiner Location verwendet (unverändert so übernommen).
server {
    listen 80;
    server_name tonn-versicherung.de www.tonn-versicherung.de;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://tonn-versicherung.de$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.tonn-versicherung.de;
    ssl_certificate     /etc/letsencrypt/live/tonn-versicherung.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tonn-versicherung.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://tonn-versicherung.de$request_uri;
}
server {
    listen 443 ssl http2;
    server_name tonn-versicherung.de;
    ssl_certificate     /etc/letsencrypt/live/tonn-versicherung.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tonn-versicherung.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/tonn-public.access.log anon_main;
    client_max_body_size 1m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location /_next/image {
        limit_req zone=general burst=250 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ignore_client_abort on;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=general burst=250 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
